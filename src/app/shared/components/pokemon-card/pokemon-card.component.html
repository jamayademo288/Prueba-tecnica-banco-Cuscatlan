<div class="w-full lg:w-[758px] h-[650px] px-4 py-6 font-poppins">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-semibold text-[#01426A]">Mis Pokémon</h2>
    <button *ngIf="!edit"
      (click)="editStack()"
      class="flex items-center gap-1 text-sm text-sky-800 border border-sky-800 px-3 py-1.5 rounded-md hover:bg-sky-800 hover:text-white transition"
    >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
    </svg>
    <span>Editar</span>
  </button>
  <button *ngIf="edit"
      (click)="actualizarStatsNormalizadas()"
      class="flex items-center gap-1 text-sm text-sky-800 border border-sky-800 px-3 py-1.5 rounded-md hover:bg-sky-800 hover:text-white transition"
    >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
    </svg>
    <span>Guardar</span>
  </button>
  </div>

  <cdk-virtual-scroll-viewport
    itemSize="200"
    class="h-[550px] w-full overflow-auto pr-2"
  >
    <div class="space-y-4 px-1">
      <div
        *cdkVirtualFor="let pokemon of pokemonsSeleccionados"
        class="bg-[#F6F7F8] rounded-xl p-4 flex gap-4 items-center shadow-sm"
      >
        <img
          [src]="pokemon.sprites.other.home.front_default"
          alt="{{ pokemon.name }}"
          class="w-28 h-28 object-contain"
        />

        <div class="flex-1">
          <h3 class="text-xl font-bold capitalize text-[#002A61]">{{ pokemon.name }}</h3>
          <p class="text-sm text-gray-600 mb-2 capitalize">
            <!-- {{ pokemon.types.map(t => t.type.name).join('/') }} -->
          </p>

          <div *ngIf="!editCard">
            <div *ngFor="let stat of pokemon.stats" class="flex items-center text-sm mb-1">
              <span class="w-[120px] capitalize text-gray-700">{{ stat.stat.name }}</span>
              <div class="w-full bg-gray-200 rounded h-2 ml-2">
                <div
                  class="h-2 rounded transition-all"
                  [ngStyle]="{
                    width: (stat.base_stat / getMaxStat(stat.stat.name) * 100) + '%',
                    backgroundColor: getStatColor(stat.stat.name)
                  }"
                ></div>
              </div>
            </div>
          </div>

          <div *ngIf="editCard">
            <div *ngFor="let stat of pokemon.stats; let i = index" class="mb-3" >
            <label class="flex justify-between items-center mb-1 text-sm text-gray-700 capitalize">
              <span>{{ stat.stat.name }}</span>
              <span>{{ stat.base_stat }} / {{ getMaxStat(stat.stat.name) }}</span>
            </label>

            <input
              type="range"
              class="w-full accent-sky-700"
              [min]="0"
              [max]="getMaxStat(stat.stat.name)"
              [value]="stat.base_stat"
              (input)="onStatChange(pokemon, i, $event)"
            />
          </div>
          </div>
        </div>
      </div>
    </div>
  </cdk-virtual-scroll-viewport>
</div>

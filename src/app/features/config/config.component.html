<div *ngIf="!loading">
  <div class="titulo w-full px-4 mt-1">
    <div class="flex items-start space-x-2">
      <!-- <img src="assets/images/arrow_back.png" alt="Atrás" class="w-3.5 h-4 mt-3" /> -->
      <div class="flex items-center justify-between gap-4">
        <!-- Texto de saludo -->
        <p class="text-[40px] font-bold text-black font-poppins">
          ¡Hola {{ nameTrainer }}!
        </p>

        <!-- Botón de editar -->
        <button
          (click)="editProfile()"
          class="flex items-center gap-1 text-sm text-sky-800 border border-sky-800 px-3 py-1.5 rounded-md hover:bg-sky-800 hover:text-white transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
          <span>Editar perfil</span>
        </button>
      </div>

    </div>
  </div>

  <div class="cuerpo flex flex-col lg:flex-row justify-between items-center gap-4 lg:gap-2 w-full max-w-screen-xl mx-auto">
    <app-image-uploaded (name)="name($event)"></app-image-uploaded>
    <app-pokemon-card></app-pokemon-card>
  </div>

</div>

<div *ngIf="loading" class="fixed top-0 left-0 w-full h-full bg-white bg-opacity-80 z-50 flex justify-center items-center">
  <app-loading></app-loading>
</div>
